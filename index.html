<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleek Tip Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Remove arrows/spinners from number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* Custom subtle shadow for the main card */
        .card-shadow {
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-[2rem] p-6 card-shadow border border-gray-100">
        <header class="mb-6 mt-2 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Tip Calculator</h1>
            <p class="text-sm text-gray-400 mt-1">Split the bill easily</p>
        </header>

        <div class="mb-5">
            <label for="wallet-balance" class="block text-sm font-semibold text-gray-600 mb-2">Wallet Balance (Optional)</label>
            <div class="relative flex items-center">
                <span class="absolute left-5 text-xl font-semibold text-gray-400">$</span>
                <input type="number" id="wallet-balance" placeholder="0.00" min="0" step="0.01" 
                    class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-xl font-bold rounded-2xl py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all transition-colors duration-200">
            </div>
        </div>

        <div class="mb-5">
            <label for="bill-amount" class="block text-sm font-semibold text-gray-600 mb-2">Bill Amount</label>
            <div class="relative flex items-center">
                <span class="absolute left-5 text-2xl font-semibold text-gray-400">$</span>
                <input type="number" id="bill-amount" placeholder="0.00" min="0" step="0.01" 
                    class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-3xl font-bold rounded-2xl py-4 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all transition-colors duration-200">
            </div>
        </div>

        <div class="mb-5">
            <label class="block text-sm font-semibold text-gray-600 mb-2">Select Tip %</label>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
                <button type="button" class="tip-btn py-3 rounded-xl font-bold text-lg bg-indigo-50 text-indigo-600 border border-indigo-100 transition-all duration-200 hover:bg-indigo-100 active:scale-95" data-tip="10">10%</button>
                <button type="button" class="tip-btn py-3 rounded-xl font-bold text-lg bg-indigo-600 text-white shadow-md transition-all duration-200 active:scale-95 selected" data-tip="15">15%</button>
                <button type="button" class="tip-btn py-3 rounded-xl font-bold text-lg bg-indigo-50 text-indigo-600 border border-indigo-100 transition-all duration-200 hover:bg-indigo-100 active:scale-95" data-tip="20">20%</button>
                <div class="relative">
                    <input type="number" id="custom-tip" placeholder="Custom" min="0" max="100"
                        class="w-full h-full bg-gray-50 border border-gray-200 text-center text-lg font-semibold rounded-xl py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-700 placeholder-gray-400">
                </div>
            </div>
        </div>

        <div class="mb-6">
            <label for="split-count" class="block text-sm font-semibold text-gray-600 mb-2">Split With (People)</label>
            <div class="flex items-center justify-between bg-gray-50 border border-gray-200 rounded-2xl p-2">
                <button id="btn-minus" class="w-12 h-12 rounded-xl bg-white text-gray-600 font-bold text-xl shadow-sm border border-gray-100 active:scale-95 transition-all">-</button>
                <input type="number" id="split-count" value="1" min="1" step="1" 
                    class="w-20 bg-transparent text-center text-gray-900 text-2xl font-bold focus:outline-none">
                <button id="btn-plus" class="w-12 h-12 rounded-xl bg-white text-gray-600 font-bold text-xl shadow-sm border border-gray-100 active:scale-95 transition-all">+</button>
            </div>
        </div>

        <div class="bg-gray-900 rounded-[1.5rem] p-6 text-white mb-2">
            
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h2 class="font-medium text-gray-300 text-sm">Total Per Person</h2>
                    <p class="text-xs text-gray-500 mt-0.5">including tip</p>
                </div>
                <div class="text-4xl font-bold tracking-tight text-white" id="total-per-person-display">
                    $0.00
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="font-medium text-gray-400 text-xs">Tip Per Person</h2>
                </div>
                <div class="text-lg font-semibold tracking-tight text-emerald-400" id="tip-per-person-display">
                    $0.00
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="font-medium text-gray-400 text-xs">Grand Total (All)</h2>
                </div>
                <div class="text-sm font-medium tracking-tight text-gray-400" id="grand-total-display">
                    $0.00
                </div>
            </div>
            
            <div class="w-full h-px bg-gray-700 my-4"></div>
            
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-medium text-gray-300 text-sm">Wallet Balance</h2>
                    <p class="text-xs text-gray-500 mt-0.5">after your share</p>
                </div>
                <div class="text-2xl font-bold tracking-tight text-gray-300" id="remaining-balance-display">
                    -
                </div>
            </div>
        </div>
    </main>

    <script>
        const billInput = document.getElementById('bill-amount');
        const walletInput = document.getElementById('wallet-balance');
        const customTipInput = document.getElementById('custom-tip');
        const splitInput = document.getElementById('split-count');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const tipButtons = document.querySelectorAll('.tip-btn');
        
        const tipPerPersonDisplay = document.getElementById('tip-per-person-display');
        const totalPerPersonDisplay = document.getElementById('total-per-person-display');
        const grandTotalDisplay = document.getElementById('grand-total-display');
        const remainingDisplay = document.getElementById('remaining-balance-display');

        let currentTipPercentage = 15; // Default tip

        // Format number to currency
        const formatMoney = (amount) => {
            if (amount < 0) {
                return '-$' + Math.abs(amount).toFixed(2);
            }
            return '$' + amount.toFixed(2);
        };

        // Main calculation function
        const calculateTip = () => {
            const billValue = parseFloat(billInput.value);
            const walletValue = parseFloat(walletInput.value);
            let splitValue = parseInt(splitInput.value);
            
            // Validate split value
            if (isNaN(splitValue) || splitValue < 1) {
                splitValue = 1;
            }

            if (isNaN(billValue) || billValue <= 0) {
                tipPerPersonDisplay.innerText = '$0.00';
                totalPerPersonDisplay.innerText = '$0.00';
                grandTotalDisplay.innerText = '$0.00';
                
                // If there's no bill, but there is a wallet balance, show full balance
                if (!isNaN(walletValue)) {
                    remainingDisplay.innerText = formatMoney(walletValue);
                    remainingDisplay.className = "text-2xl font-bold tracking-tight text-gray-300";
                } else {
                    remainingDisplay.innerText = '-';
                    remainingDisplay.className = "text-2xl font-bold tracking-tight text-gray-300";
                }
                return;
            }

            // Calculations
            const tipAmount = billValue * (currentTipPercentage / 100);
            const totalAmount = billValue + tipAmount;
            
            const tipPerPerson = tipAmount / splitValue;
            const totalPerPerson = totalAmount / splitValue;

            // Update displays
            tipPerPersonDisplay.innerText = formatMoney(tipPerPerson);
            totalPerPersonDisplay.innerText = formatMoney(totalPerPerson);
            grandTotalDisplay.innerText = formatMoney(totalAmount);

            // Handle wallet balance calculation based on USER'S SHARE (totalPerPerson)
            if (!isNaN(walletValue)) {
                const remaining = walletValue - totalPerPerson;
                remainingDisplay.innerText = formatMoney(remaining);
                
                // Highlight in red if balance goes below zero
                if (remaining < 0) {
                    remainingDisplay.className = "text-2xl font-bold tracking-tight text-red-400";
                } else {
                    remainingDisplay.className = "text-2xl font-bold tracking-tight text-gray-300";
                }
            } else {
                remainingDisplay.innerText = '-';
                remainingDisplay.className = "text-2xl font-bold tracking-tight text-gray-300";
            }
        };

        // Handle quick tip button clicks
        tipButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                // Update active state styling for buttons
                tipButtons.forEach(btn => {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'selected');
                    btn.classList.add('bg-indigo-50', 'text-indigo-600', 'border', 'border-indigo-100');
                });
                
                const clickedBtn = e.target;
                clickedBtn.classList.remove('bg-indigo-50', 'text-indigo-600', 'border', 'border-indigo-100');
                clickedBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'selected');

                // Clear custom tip input
                customTipInput.value = '';

                // Update percentage and calculate
                currentTipPercentage = parseFloat(clickedBtn.dataset.tip);
                calculateTip();
            });
        });

        // Handle custom tip input
        customTipInput.addEventListener('input', (e) => {
            const customValue = parseFloat(e.target.value);
            
            // Remove active state from all preset buttons
            tipButtons.forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'selected');
                btn.classList.add('bg-indigo-50', 'text-indigo-600', 'border', 'border-indigo-100');
            });

            if (!isNaN(customValue) && customValue >= 0) {
                currentTipPercentage = customValue;
            } else {
                currentTipPercentage = 0; // fallback if empty
            }
            calculateTip();
        });

        // Handle split buttons
        btnMinus.addEventListener('click', () => {
            let val = parseInt(splitInput.value);
            if (val > 1) {
                splitInput.value = val - 1;
                calculateTip();
            }
        });

        btnPlus.addEventListener('click', () => {
            let val = parseInt(splitInput.value) || 1;
            splitInput.value = val + 1;
            calculateTip();
        });

        // Listen for input changes
        billInput.addEventListener('input', calculateTip);
        walletInput.addEventListener('input', calculateTip);
        splitInput.addEventListener('input', () => {
            if(parseInt(splitInput.value) < 1) splitInput.value = 1;
            calculateTip();
        });
    </script>
</body>
</html>
